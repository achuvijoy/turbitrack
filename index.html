<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TurbiTrack - Cloud Telemetry</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(21, 30, 48, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.18);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 960px; }
    
    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; padding: 16px 20px;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    }
    .header-title { font-size: 1.25rem; font-weight: 800; color: #fff; }
    .header-title span { color: var(--primary); }
    .status-indicator { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; font-weight: 600; color: var(--muted); }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--success); box-shadow: 0 0 10px var(--success); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px 18px; display: flex; flex-direction: column; gap: 8px; }
    .card-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; font-weight: 700; }
    .card-value { font-size: 2.1rem; font-weight: 800; color: var(--primary); line-height: 1.1; }
    .card-subtext { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    .badge { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: 800; width: fit-content; text-transform: uppercase; }
    .badge-open { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
    .badge-closed { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
    .badge-normal { background: var(--success-bg); color: var(--success); border: 1px solid var(--success); }
    .badge-danger { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }

    .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px; padding: 20px; overflow-x: auto; }
    .table-title { font-size: 0.95rem; font-weight: 800; color: #fff; margin-bottom: 14px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.8rem; }
    th { color: var(--muted); text-transform: uppercase; font-size: 0.7rem; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <div class="header-title">Turbi<span>Track</span> Pro</div>
      <div class="status-indicator">
        <div class="status-dot" id="liveDot"></div>
        <span id="liveStatusText">Cloud Connected</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">Live Turbidity</div>
        <div class="card-value" id="valPercent">-- %</div>
